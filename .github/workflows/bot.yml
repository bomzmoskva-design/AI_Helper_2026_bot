name: Avito Phone Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запустить бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python bot.py

      - name: Сохранить базу объявлений
        run: |
          git config user.name "avito-monitor"
          git config user.email "avito-monitor@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || git commit -m "Update seen listings"
          git push || true
