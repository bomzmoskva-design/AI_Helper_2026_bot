name: Запуск бота курьеров

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить библиотеки
        run: pip install -r requirements.txt

      - name: Проверить файлы
        run: |
          echo "Проверяем файлы проекта"
          ls -la
          test -f bot.py || (echo "ОШИБКА: файл bot.py не найден" && exit 1)
          test -f requirements.txt || (echo "ОШИБКА: файл requirements.txt не найден" && exit 1)

      - name: Запустить бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python -u bot.py
